name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Build & Test API (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore VehicleIQ.API/VehicleIQ.API.csproj

      - name: Build API
        run: dotnet build VehicleIQ.API/VehicleIQ.API.csproj --no-restore -c Release

  frontend:
    name: Build & Lint Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: VehicleIQ.React/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: VehicleIQ.React

      - name: Build Frontend
        run: npm run build
        working-directory: VehicleIQ.React
