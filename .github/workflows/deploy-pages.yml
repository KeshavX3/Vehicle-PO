name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: VehicleIQ.React/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: VehicleIQ.React

      - name: Build React Application
        run: npm run build
        working-directory: VehicleIQ.React

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'VehicleIQ.React/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
